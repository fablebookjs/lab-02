name: 'Prerelease: Trigger publication'

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  signal:
    if: github.repository == 'fablebookjs/lab-02'
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the trusted main controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: controller
          persist-credentials: false
          ref: main
      - name: Record the closed pull request without checking out its code
        env:
          SIGNAL: ${{ runner.temp }}/prerelease-pr.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        with:
          script: |
            const handler = require('./controller/scripts/github/release-proposal/signal.ts').default
            return handler({ github, context, core, env: process.env })
      - name: Transfer the inert pull request identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prerelease-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/prerelease-pr.json
          retention-days: 1
