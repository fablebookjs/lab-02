name: 'CI: Validate changes'
run-name: "CI validation · ${{ github.event_name == 'pull_request' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || format('push {0} · {1}', github.ref_name, github.event.head_commit.message) }}"

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/v*'

permissions:
  contents: read

jobs:
  check:
    name: build, test, and pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install, compile, test, and exercise packed packages
        env:
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          GITHUB_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
