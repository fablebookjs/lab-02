name: 'Release: Trigger proposal maintenance'
run-name: "Release maintenance · ${{ github.event_name == 'pull_request_target' && format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || format('push {0} · {1}', github.ref_name, github.event.head_commit.message) }}"

on:
  push:
    branches:
      - 'releases/v*'
  pull_request_target:
    branches:
      - 'releases/v*'
    types:
      - closed

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the trusted main controller
        run: ':'
      - name: Check out only the trusted main controller
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: controller
          persist-credentials: false
          ref: main
      - name: Record the closed pull request without checking out code
        if: github.event_name == 'pull_request_target'
        env:
          SIGNAL: ${{ runner.temp }}/release-pr.json
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        with:
          script: |
            const handler = require('./controller/scripts/github/release-proposal/signal.ts').default
            return handler({ github, context, core, env: process.env })
      - name: Transfer the inert pull request identity
        if: github.event_name == 'pull_request_target'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-pr-${{ github.run_id }}
          path: ${{ runner.temp }}/release-pr.json
          retention-days: 1
