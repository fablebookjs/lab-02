name: 'Publish: Publish approved release'
run-name: 'Publication follow-up · after ${{ github.event.workflow_run.display_title }}'

on:
  workflow_run:
    workflows:
      - 'MANUAL - Prerelease: Enter phase'
      - 'MANUAL - Release: Start new release line'
      - 'Prerelease: Trigger publication'
      - 'Release: Trigger proposal maintenance'
    types:
      - completed

permissions:
  contents: read

jobs:
  route:
    if: >-
      github.repository == 'fablebookjs/lab-02' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      authority-kind: ${{ steps.classify.outputs.authority-kind }}
      publish: ${{ steps.classify.outputs.publish }}
      skip-reason: ${{ steps.classify.outputs.skip-reason }}
      upstream-run-id: ${{ steps.classify.outputs.upstream-run-id }}
    steps:
      - name: Check out only the trusted main router
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Classify the completed upstream workflow
        id: classify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8
        with:
          script: |
            const handler = require('./scripts/github/publication-routing/classify.ts').default
            return handler({ github, context, core, env: process.env })

  skip:
    name: Publication skipped
    needs: route
    if: >-
      needs.route.result == 'success' &&
      needs.route.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report the explicit skip reason
        env:
          SKIP_REASON: ${{ needs.route.outputs.skip-reason }}
        run: echo "Publication skipped - ${SKIP_REASON}"

  stable:
    needs: route
    if: needs.route.outputs.authority-kind == 'stable-pr'
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/complete-stable-publication.yml
    with:
      authority-kind: ${{ needs.route.outputs.authority-kind }}
      upstream-run-id: ${{ fromJSON(needs.route.outputs.upstream-run-id) }}
    secrets: inherit

  prerelease:
    needs: route
    if: >-
      needs.route.outputs.authority-kind == 'ordinary-prerelease-pr' ||
      needs.route.outputs.authority-kind == 'phase-entry' ||
      needs.route.outputs.authority-kind == 'release-cut-bootstrap'
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/publish-prerelease.yml
    with:
      authority-kind: ${{ needs.route.outputs.authority-kind }}
      upstream-run-id: ${{ fromJSON(needs.route.outputs.upstream-run-id) }}
    secrets: inherit
